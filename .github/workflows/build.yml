name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Das iPhone Duo braucht das iOS-27.1-SDK, das es nur auf dem Xcode-27-Image gibt.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Neueste stabile Xcode-Version wählen
        shell: bash
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            XC=/Applications/Xcode_27.1.app
          else
            XC=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|candidate|_rc|preview' | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XC"
          echo "::notice::Xcode: $(xcodebuild -version | tr '\n' ' ') | iOS-SDK: $(xcrun --sdk iphoneos --show-sdk-version) | vorhanden: $(ls /Applications | grep -i xcode | tr '\n' ' ')"

      - name: Xcode-Projekt erzeugen
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Bauen (unsigniert)
        shell: bash
        run: |
          build() {
            xcodebuild \
              -project Lesen.xcodeproj \
              -scheme Lesen \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) $1" \
              > build.log 2>&1
          }
          report() {
            grep -E "error:" build.log | sed -E 's#^.*/Lesen/##' | sort -u | head -n 12 | while IFS= read -r line; do
              echo "::$1::[$2] ${line}"
            done
          }
          # Die Duo-Funktionen brauchen das iOS-27.1-SDK. Fehlt es, wird ohne sie gebaut.
          for flags in "DUO_HINGE DUO_COVER DUO_FOLD DUO_BAR" "DUO_HINGE DUO_COVER DUO_FOLD" "DUO_HINGE DUO_COVER" "DUO_HINGE" ""; do
            if build "$flags"; then
              echo "::notice::Gebaut mit Duo-Funktionen: '${flags:-keine}'"
              exit 0
            fi
            if [ -z "$flags" ]; then
              report error "ohne Duo"
              tail -n 12 build.log
              exit 1
            fi
            report warning "$flags"
          done

      - name: IPA verpacken
        shell: bash
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "Lesen.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Lesen.ipa Payload
          ls -lh Lesen.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lesen-ipa
          path: Lesen.ipa

      - name: Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          body: Unsignierte IPA zum Installieren mit AltStore.
          files: Lesen.ipa

  preview:
    # Startet die App im Simulator, prüft den Lesemotor und legt Bildschirmfotos ab.
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Projekt erzeugen
        shell: bash
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          brew install xcodegen
          xcodegen generate

      - name: Tests im Simulator
        shell: bash
        run: |
          LIST=$(xcrun simctl list devices available)
          LINE=$(echo "$LIST" | grep -i "iPhone" | grep -i "duo" | head -1)
          [ -z "$LINE" ] && LINE=$(echo "$LIST" | grep -i "iPhone" | head -1)
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}' | head -1)
          echo "::notice::Simulator: $(echo $LINE | cut -c1-80)"
          rm -rf /tmp/lesen-shots
          mkdir -p /tmp/lesen-shots
          set +e
          FLAGS="SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) DEBUG DUO_HINGE DUO_COVER DUO_FOLD DUO_BAR"
          xcodebuild build-for-testing -project Lesen.xcodeproj -scheme Preview \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO "$FLAGS" > test.log 2>&1
          code=$?
          xcrun simctl boot "$UDID" 2>/dev/null
          xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1
          HINGE="Tools/hinge/hinge -d $UDID"
          echo "Klappwerkzeug: $($HINGE -v 2>&1)" > hinge.log

          # Die Tests bitten per Markierungsdatei um ein Foto des ganzen Displays.
          touch /tmp/lesen-watch
          (
            while [ -f /tmp/lesen-watch ]; do
              for m in /tmp/lesen-shots/foto-*.bitte; do
                [ -e "$m" ] || continue
                n=$(basename "$m" .bitte)
                $HINGE screenshot "/tmp/lesen-shots/$n.png" >> hinge.log 2>&1 \
                  || xcrun simctl io "$UDID" screenshot "/tmp/lesen-shots/$n.png" >> hinge.log 2>&1
                # Außendisplay zusätzlich, falls innen gelesen wird
                xcrun simctl io "$UDID" screenshot --display=LCD "/tmp/lesen-shots/$n-aussendisplay.png" >> hinge.log 2>&1
                rm -f "$m"
              done
              sleep 0.2
            done
          ) &

          run_tests() {
            xcodebuild test-without-building -project Lesen.xcodeproj -scheme Preview \
              -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build-sim \
              CODE_SIGNING_ALLOWED=NO "$@" >> test.log 2>&1
            local result=$?
            [ $result -ne 0 ] && code=$result
          }

          if [ $code -eq 0 ]; then
            # 1. So wie der Simulator startet (zugeklappt): alle Tests
            echo "== Lage: Start $($HINGE posture 2>&1 | tr '\n' ' ')" >> hinge.log
            run_tests
            # 2. Flach aufgeklappt und 3. halb aufgeklappt (Buchhaltung): echtes Display
            for angle in 180 110 0; do
              $HINGE $angle >> hinge.log 2>&1
              sleep 4
              echo "== Lage $angle: $($HINGE posture 2>&1 | tr '\n' ' ')" >> hinge.log
              run_tests -only-testing:LesenTests/PreviewTests/testRealDevice
              [ $angle = 180 ] && run_tests -only-testing:LesenTests/PreviewTests/testTurningShowsOnlyFinishedPages
            done
          fi
          rm -f /tmp/lesen-watch
          sleep 1
          grep -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ tests|Fatal|crashed|Terminating" test.log | sed -E 's#^.*/(Lesen|Tests)/##' | sort -u | head -n 30 | while IFS= read -r line; do
            echo "::warning::[test] ${line}"
          done
          mkdir -p shots
          cp /tmp/lesen-shots/*.png shots/ 2>/dev/null
          cp /tmp/lesen-shots/messung.txt shots/ 2>/dev/null
          cp hinge.log shots/klappen.txt 2>/dev/null
          # Leere Fotos des ausgeschalteten Außendisplays aussortieren
          find shots -name "*-aussendisplay.png" -size -40k -delete
          {
            echo "Exit $code"
            grep -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ tests|Fatal|crashed|Terminating|XCTAssert" test.log | sed -E 's#^.*/(Lesen|Tests)/##' | sort -u | head -n 80
            echo "--- simctl"
            xcrun simctl help 2>&1 | grep -i -E 'fold|hinge|posture'
            xcrun simctl io "$UDID" enumerate 2>&1 | head -n 40
          } > shots/tests.txt 2>&1
          echo "::notice::Bildschirmfotos: $(ls shots | tr '\n' ' ') | Exit $code"
          tail -n 5 test.log
          exit 0

      - name: Bildschirmfotos ablegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Vorschau (automatische Bildschirmfotos)
          prerelease: true
          files: shots/*
