name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neueste stabile Xcode-Version wählen
        shell: bash
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|_rc|preview' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "::notice::Xcode: $(xcodebuild -version | tr '\n' ' ') | iOS-SDK: $(xcrun --sdk iphoneos --show-sdk-version) | vorhanden: $(ls /Applications | grep -i xcode | tr '\n' ' ')"

      - name: Xcode-Projekt erzeugen
        shell: bash
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Bauen (unsigniert)
        shell: bash
        run: |
          build() {
            xcodebuild \
              -project Lesen.xcodeproj \
              -scheme Lesen \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              "SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) $1" \
              > build.log 2>&1
          }
          report() {
            grep -E "error:" build.log | sed -E 's#^.*/Lesen/##' | sort -u | head -n 9 | while IFS= read -r line; do
              echo "::$1::[$2] ${line}"
            done
          }
          # Die Duo-Funktionen brauchen das iOS-27.1-SDK. Fehlt es, wird ohne sie gebaut.
          for flags in "DUO_HINGE DUO_COVER" "DUO_HINGE" ""; do
            if build "$flags"; then
              echo "::notice::Gebaut mit Duo-Funktionen: '${flags:-keine}'"
              exit 0
            fi
            if [ -z "$flags" ]; then
              report error "ohne Duo"
              tail -n 12 build.log
              exit 1
            fi
            report warning "$flags"
          done

      - name: IPA verpacken
        shell: bash
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "Lesen.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Lesen.ipa Payload
          ls -lh Lesen.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lesen-ipa
          path: Lesen.ipa

      - name: Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neueste Version
          body: Unsignierte IPA zum Installieren mit AltStore.
          files: Lesen.ipa
