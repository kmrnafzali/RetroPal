name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'EmulateurGBA/**'
      - 'EmulateurGBA.xcodeproj/**'

permissions:
  contents: read

concurrency:
  group: retropal-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned RetroPal IPA
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for tool in cmake ninja pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              brew install "$tool"
            fi
          done
          cmake --version
          mkdir -p build-logs

      - name: Fetch pinned emulator sources
        run: |
          set -euo pipefail
          git submodule update --init --jobs 4
          git -C Vendor/MoltenVK fetch --tags
          git submodule status > build-logs/submodule-versions.txt
          git rev-parse HEAD > build-logs/source-commit.txt

      - name: Build emulator libraries
        run: |
          set -euo pipefail
          for core in melonds mesen pcsx moltenvk n64 blastem ppsspp azahar archive; do
            echo "::group::Build $core"
            bash "Vendor/$core-ios/build.sh" 2>&1 | tee "build-logs/$core.log"
            echo "::endgroup::"
          done

      - name: Build iPhone application without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project EmulateurGBA.xcodeproj \
            -scheme EmulateurGBA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RetroPalDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee build-logs/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RetroPalDerivedData/Build/Products/Release-iphoneos/EmulateurGBA.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXECUTABLE"
          lipo -verify_arch arm64 "$APP/$EXECUTABLE"
          mkdir -p "$RUNNER_TEMP/RetroPalPackage/Payload" "$GITHUB_WORKSPACE/output"
          ditto "$APP" "$RUNNER_TEMP/RetroPalPackage/Payload/EmulateurGBA.app"
          cd "$RUNNER_TEMP/RetroPalPackage"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/output/RetroPal-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          unzip -t output/RetroPal-unsigned.ipa
          shasum -a 256 output/RetroPal-unsigned.ipa > output/SHA256SUMS.txt
          echo "### RetroPal IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the RetroPal-unsigned artifact. The IPA must be signed before installation on an iPhone." >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RetroPal-unsigned
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPal-build-logs
          path: |
            build-logs/
            Vendor/*-ios/build/*.log
          if-no-files-found: ignore
          retention-days: 7
